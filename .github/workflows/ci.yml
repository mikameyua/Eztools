# ============================================================================
#  CI —— 构建 + 三层机器验证
#
#  跑什么、为什么不跑其余的（这是设计决策，不是遗漏）：
#
#    ✅ 构建          dotnet build（.sln 全解）
#    ✅ selftest      336 项端到端断言 · 纯托管· 无需特权 · 约 30s
#    ✅ review-guards G1~G8 静态规则 · 纯文本分析 · 约 5s
#    ✅ check-doc-refs 文档交叉引用 0悬空 · 约 1s
#
#    ❌ acceptance.sh    **排除**：需真UAC 提权、托盘窗口、真实热键注册。
#                      脚本自身对环境依赖项有skip 计数，但在 CI 里
#                      大量关键项会退化为skip —— 那时它的判别力很低，
#                      反而制造"红了不知道为什么"的噪声。改由手工验收承担
#                      （见 docs/W*-手工验收清单.md）。
#    ❌ verify-desktop.py **排除**：同理，需真实桌面会话（当前 runner 无 GUI）。
#    ❌ verify-runtimes   **排除**：它要真跑自包含产物，耗时且需先publish。
#                      发布前的验证由 make-portable.sh +手工跑该脚本承担。
#
#  ★ 判据一律「FAIL=0」，不是"命令没报错"。
# ============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 手动触发（Actions 页左侧 Run workflow）
  workflow_dispatch:

# 同一分支的新push 取消旧构建，避免排队浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: 构建 + 验证
    #windows-latest：TFM 是 net10.0-windows*，只能在 Windows 上构建
    runs-on: windows-latest

    # 失败时要把诊断写进 issue（见最后一个 step）。
    # 为什么需要它：CI 日志的三种取法在**无凭证**时全部不通 ——
    #   api/actions/runs/*/logs → 403 Must have admin rights
    #   job 页面 → CSR 壳，日志异步加载
    #   runs/<id>/logs|steps → 404
    # 而 issue 内容是匿名可读的 ⇒ 把诊断写进 issue 是唯一无凭证可见的通道。
    permissions:
      contents: read
      issues: write

    env:
      # ★ 自包含配置只在 Release/publish 生效（见csproj 条件属性），
      #   CI 用 Debug 构建 ⇒ 不塞运行时，保持快速构建。
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      # ★★ 必须：本仓的验收脚本大量 print 中文，而 Python 默认按**系统 locale**
      #    编码 stdout —— runner 是英文 locale（cp1252），print 中文会直接抛
      #    UnicodeEncodeError **崩溃**（不是乱码，是崩）。
      #    实测：CI 首次跑时守卫就栽在这里（本机中文系统一直掩盖着）。
      #    脚本侧已各自 reconfigure 兜底（环境无关），此处再设一层是为了
      #    覆盖将来新增的、可能忘了加保护的脚本。
      PYTHONUTF8: '1'

    strategy:
      fail-fast: false
      matrix:
        # 与 payload/ 里现役的 3.13.x 同major.minor。
        # 钉住小版本是为了让"运行时部署"这条链路在 CI 上真的被跑到，
        # 而不是碰巧用系统 Python —— 后者会让 selftest 静默降级。
        python-version: ['3.13']

    steps:
      # ── 1. 检出 ──
      - name: 检出代码
        uses: actions/checkout@v4

      # ── 2. 装 SDK（用 global.json 钉住，避免 runner 默认版本漂移）──
      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # ── 3. 缓存 NuGet（依赖少但每次全解会慢）──
      - name: 缓存 NuGet 包
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # ── 3b. 装 Python（供make-payload.sh 生成隔离运行时载荷）──
      #   ★ 必须在"准备载荷"之前。CI runner 自带的 Python 不可重定位
      #     （记录了解释器绝对路径），make-payload.sh 会拒绝。
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ── 4. 构建（-warnaserror 之外只开增量，避免 --no-incremental 拖慢）──
      - name: 构建
        run: dotnet build Eztools.sln -c Debug --nologo -v minimal

      # ── 5. 准备 Python 运行时载荷 ★关键前置 ──
      #   selftest 会 EnsureRuntimeAsync("python")，从 payload/ 解压隔离运行时。
      #   **payload/ 被 .gitignore 排除**（14 MB，不入库），克隆体里没有它
      #   ⇒ 运行时部署失败 ⇒ selftest 在第一项就判 FAIL 并提前返回。
      #   这是本CI 第一次真跑时实际踩到的（不是预防性假设）。
      #   选setup-python 而非"跳过依赖运行时的用例"：后者会把真实缺失
      #   藏进skip 通道，违反本项目「跳过必须计数且不得掩盖缺失」的纪律。
      - name: 准备 Python 运行时载荷
        shell: bash
        run: |
          set -euo pipefail
          # setup-python 装的是独立安装（非 venv、非 embeddable zip），
          # 正好满足 make-payload.sh 的可重定位要求
          PY_DIR="$(python -c "import sys,os; print(os.path.dirname(sys.executable))")"
          echo "源Python: $PY_DIR ($(python -V 2>&1))"
          bash scripts/make-payload.sh "$PY_DIR" payload
          # ★ 判据：产物文件必须真实存在。
          #   刻意**不用** `ezt runtime payloads`当判据—— 实测它无论有无
          #   payload 都返回 rc=0（只打印扫描结果），拿它守门就是恒绿断言。
          #   名称形态由 make-payload.sh 的 ARCHIVE_NAME 决定：
          #   python-<版本>-<rid>.tar.gz
          shopt -s nullglob
          found=(payload/python-*.tar.gz)
          if [ ${#found[@]} -eq 0 ]; then
            echo "::error::make-payload.sh 跑完但payload/ 里没有产物"
            ls -la payload/ || true
            exit 1
          fi
          ls -la payload/
          echo "载荷就位：${found[0]}"

      # ── 6. selftest ──
      #   ⚠️ 输出目录带 Windows 平台后缀（Cli 依赖 net10.0-windows 的 Win32 API），
      #   不能写成 net10.0 —— 那是本项目踩过的坑。
      #
      #   ★ 失败时把完整输出打出来：只留一句"exit 1"会让人完全无从下手
      #     （本项目已因此多花一轮）。判据仍是 rc，非 0 即失败。
      - name: 端到端自检
        shell: pwsh
        run: |
          $exe = "src/Eztools.Cli/bin/Debug/net10.0-windows10.0.19041.0/ezt.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "找不到自检宿主 $exe —— 构建输出路径与预期不符"
            exit 1
          }
          # 诊断信息：失败时最需要的是"哪一项FAIL"与"运行时从哪来"
          "DOTNET_ROOT      = $env:DOTNET_ROOT"
          "PYTHON_HOME      = $env:PYTHON_HOME"
          "PYTHONPATH       = $env:PYTHONPATH"
          "PYTHONUTF8= $env:PYTHONUTF8"
          ""
          # ★ 编码：ezt 输出是 UTF-8，Windows 控制台默认按 GBK 解码 ⇒ 必须显式
          #   指定，否则日志里的中文全成乱码，诊断信息等于没有。
          #   [Console]::OutputEncoding 管读，-Encoding 管写，两处都要设。
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $env:PYTHONUTF8 = '1'

          & $exe selftest 2>&1 | Out-File -FilePath selftest.log -Encoding utf8
          $rc = $LASTEXITCODE
          Get-Content selftest.log -Encoding utf8 | Select-Object -Last 30
          if ($rc -ne 0) {
            ""
            "==================== 失败诊断 ===================="
            "---- [FAIL] 行 ----"
            Select-String -Path selftest.log -Pattern '[FAIL]' -SimpleMatch -Encoding utf8 | ForEach-Object { $_.Line }
            "---- 末尾 40 行 ----"
            Get-Content selftest.log -Encoding utf8 -Tail 40
            exit $rc
          }

      # ── 7. 静态守卫 ──
      - name: 静态守卫 G1~G8
        run: |
          python scripts/review-guards.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/review-guards.py --selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ── 8. 文档交叉引用 ──
      - name: 文档引用零悬空
        run: |
          python scripts/check-doc-refs.py --strict
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ── 9. 失败时把诊断归档到 issue ────────────────────────────────────────
      # 为什么需要这一步（不是过度设计）：
      #   本项目排查 CI 失败时遇到一个硬约束 —— **无凭证取不到日志**：
      #     · api/actions/runs/*/logs  → 403 Must have admin rights
      #     · job 页面                  → CSR 壳，日志异步加载，抓不到正文
      #     · runs/<id>/logs 或 /steps  → 404
      #   而 **issue 内容是匿名可读的** ⇒ 这是唯一无凭证可见的通道。
      #   实测教训（2026-10-08）：为读一次失败日志白等两轮，直到把诊断
      #   打进 job 日志由人转贴才定位。自动化这一步后不再依赖人工转贴。
      #
      # 复用同一 issue（按 marker 查找），避免每次失败都新开一条。
      - name: 失败时归档诊断到 issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- ci-failure-digest -->';
            const RUN_URL = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let digest;
            try {
              const log = fs.readFileSync('selftest.log', 'utf8');
              const lines = log.split(/\r?\n/);
              const fails = lines.filter(l => l.includes('[FAIL]')).slice(0, 40);
              digest = [
                '#### `[FAIL]` 行',
                '```',
                fails.length ? fails.join('\n') : '(无 —— 失败可能发生在 selftest 之前)',
                '```',
                '#### 输出末尾 60 行',
                '```',
                lines.slice(-60).join('\n'),
                '```',
              ].join('\n');
            } catch (e) {
              digest = '⚠️ 未找到 `selftest.log` —— 失败发生在写入该日志之前（构建 / 载荷步骤）。';
            }

            const body = [
              MARKER,
              '## CI 运行失败诊断',
              '',
              `- run: ${RUN_URL}`,
              `- commit: \`${context.sha}\``,
              `- 触发: ${context.eventName}`,
              '',
              digest,
              '',
              '> 本 issue 由 CI 自动维护（复用同一条，只追加评论）。',
              '> 用途：CI 日志在无凭证时不可读，此处是唯一无凭证可见的通道。',
            ].join('\n');

            // 查找已有的诊断 issue
            const existing = await github.rest.issues.listForRepo({
              ...context.repo, state: 'all', labels: 'ci-digest', per_page: 10,
            });
            const found = existing.data.find(i => (i.body || '').includes(MARKER));

            if (found) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: found.number,
                body: `**新一次失败**（${new Date().toISOString()}）\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: '[CI] 运行失败诊断（自动维护）',
                labels: ['ci-digest'],
                body,
              });
            }
