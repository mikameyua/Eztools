name: 功能建议
description: 提出新功能或改进想法
labels: enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。本项目是**自己编写全部工具**的一体化工具集，不做插件平台 ——
        所以判断一个需求是否值得做，看的是它能否落在通用底座上，而不是"能不能接进来"。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 先说问题，再说方案。这比直接提功能更容易被采纳。
      placeholder: |
        现在要 ___，得手动 ___
        希望能 ___
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 你认为它属于哪一层
      description: 选最接近的一层即可
      options:
        - 通用底座（热键 / 托盘 / 面板 / 剪贴板 / 搜索）
        - 新工具（tools/ 下新增一个目录）
        - 现有工具的能力增强
        - 仅界面 / 交互改进
        - 不确定
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的其他办法
      description: 包括现有工具组合、第三方软件等
