name: Bug 报告
description: 报告一个可复现的问题
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        感谢你愿意花时间反馈。**先看一眼下面的清单** —— 本项目有几类"看起来是 bug，其实是已知限制"的情况。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前自查
      options:
        - label: 我已搜索过现有 issue，确认不是重复
          required: true
        - label: 我跑过 `ezt doctor` 与 `ezt selftest`，问题仍在
          required: true
        - label: 我知道本项目**仅支持 Windows**，且依赖 MFT / USN Journal / WPF

  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 看到了什么？期望什么？
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 一步步写，别人照着能复现的那种
      placeholder: |
        1. 启动托盘
        2. 按 Ctrl+Alt+X 触发区域截图
        3. 观察到托盘无任何反应
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: 环境
      value: |
        - Eztools 版本：
        - Windows 版本：
        - .NET（若用源码构建）：
        - 安装形态：便携包 / 源码构建
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: |
        `%LOCALAPPDATA%\Eztools\logs\` 下的相关日志片段最有帮助。
        若是索引/搜索问题，也请附上 `ezt search status` 的输出。
      render: shell

  - type: checkboxes
    id: known-limits
    attributes:
      label: 补充确认
      options:
        - label: 我读过 README 的「已知限制」，确认不在其中
          required: false
